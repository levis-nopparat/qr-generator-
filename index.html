<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้าง QR Code พร้อมโลโก้</title>
    <!-- นำเข้า Tailwind CSS เพื่อความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- นำเข้า Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- นำเข้า Library สำหรับสร้าง QR Code (EasyQRCodeJS รองรับโลโก้ได้ดีมาก) -->
    <script src="https://unpkg.com/easyqrcodejs@4.6.1/dist/easy.qrcode.min.js"></script>
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
        /* ซ่อน Canvas ชั่วคราวที่ใช้สำหรับวาดรูปรวม */
        #hidden-canvas { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl w-full max-w-4xl flex flex-col md:flex-row gap-8">
        
        <!-- ส่วนตั้งค่า (ซ้าย) -->
        <div class="w-full md:w-1/2 flex flex-col gap-5">
            <h1 class="text-2xl font-bold text-gray-800 border-b pb-2">⚙️ ตั้งค่า QR Code</h1>
            
            <!-- ลิ้งก์ปลายทาง -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ลิ้งก์ปลายทาง (URL)</label>
                <input type="text" id="qr-url" value="https://www.facebook.com/ReKaKungTaLay" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <!-- ข้อความใต้ QR Code -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความด้านล่าง</label>
                <input type="text" id="qr-text" value="สแกนเพื่อเยี่ยมชม Facebook Page" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <!-- อัปโหลดโลโก้ -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อัปโหลดโลโก้ตรงกลาง (แนะนำภาพ 1:1)</label>
                <input type="file" id="logo-upload" accept="image/png, image/jpeg" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
                <p class="text-xs text-gray-500 mt-1">* หากไม่อัปโหลด จะเป็น QR Code ธรรมดา</p>
            </div>

            <!-- ปุ่มสร้าง และ ดาวน์โหลด -->
            <div class="flex gap-3 mt-4">
                <button onclick="generateQRCode()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition">
                    🔄 สร้างรูปภาพใหม่
                </button>
                <button onclick="downloadImage()" class="flex-1 bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg shadow transition">
                    💾 ดาวน์โหลดรูปภาพ
                </button>
            </div>
            
            <div class="text-sm text-gray-500 mt-4 bg-yellow-50 p-3 rounded border border-yellow-200">
                <strong>💡 วิธีอัปโหลดรูปขึ้น GitHub (หลังจากดาวน์โหลด):</strong><br>
                1. ไปที่ Repository ใน GitHub ของคุณ<br>
                2. คลิกปุ่ม "Add file" -> "Upload files"<br>
                3. ลากไฟล์ที่ดาวน์โหลดไปใส่ แล้วกด "Commit changes"
            </div>
        </div>

        <!-- ส่วนแสดงผล (ขวา) -->
        <div class="w-full md:w-1/2 flex flex-col items-center justify-center bg-gray-50 rounded-xl p-4 border-2 border-dashed border-gray-300">
            <h2 class="text-lg font-medium text-gray-600 mb-4">ตัวอย่างผลลัพธ์</h2>
            
            <!-- พื้นที่แสดงรูปภาพที่ประมวลผลเสร็จแล้ว -->
            <img id="final-preview" src="" alt="QR Code Preview" class="max-w-full h-auto shadow-md rounded bg-white" style="display: none;">
            
            <!-- พื้นที่ซ่อนสำหรับให้ Library สร้าง QR Code -->
            <div id="qr-temp" style="display: none;"></div>
            <!-- Canvas สำหรับรวมภาพ QR และข้อความ -->
            <canvas id="hidden-canvas"></canvas>
            
            <p id="loading-text" class="text-gray-400 mt-4">กำลังรอการสร้าง...</p>
        </div>

    </div>

    <script>
        // ตัวแปรเก็บข้อมูลรูปโลโก้ (Data URL)
        let currentLogoDataUrl = null;

        // จัดการเมื่อผู้ใช้อัปโหลดรูปโลโก้
        document.getElementById('logo-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    currentLogoDataUrl = event.target.result;
                    generateQRCode(); // สร้างใหม่ทันทีที่เลือกรูป
                };
                reader.readAsDataURL(file);
            }
        });

        // ฟังก์ชันหลักสำหรับสร้าง QR Code และวาดข้อความ
        function generateQRCode() {
            const url = document.getElementById('qr-url').value;
            const bottomText = document.getElementById('qr-text').value;
            const tempDiv = document.getElementById('qr-temp');
            const previewImg = document.getElementById('final-preview');
            const loadingText = document.getElementById('loading-text');

            if (!url) {
                alert("กรุณาใส่ลิ้งก์ปลายทาง");
                return;
            }

            // ล้างข้อมูลเก่า
            tempDiv.innerHTML = '';
            loadingText.style.display = 'block';
            previewImg.style.display = 'none';

            // ตั้งค่าสำหรับ EasyQRCodeJS
            const options = {
                text: url,
                width: 400,
                height: 400,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H, // ระดับ H จำเป็นมากเมื่อมีโลโก้ตรงกลาง
                dotScale: 1, // ขนาดจุด
            };

            // ถ้ามีโลโก้ ให้เพิ่มการตั้งค่าโลโก้
            if (currentLogoDataUrl) {
                options.logo = currentLogoDataUrl;
                options.logoWidth = 100;
                options.logoHeight = 100;
                options.logoBackgroundTransparent = false; // ให้มีพื้นหลังขาวหลังโลโก้
                options.logoBackgroundColor = '#ffffff';
            }

            // 1. สร้าง QR Code ด้วย Library (จะสร้างเป็น Canvas ซ่อนไว้ใน #qr-temp)
            new QRCode(tempDiv, options);

            // รอให้ Library วาด QR เสร็จ (ใช้ setTimeout เล็กน้อยเพื่อให้ DOM อัปเดต)
            setTimeout(() => {
                const qrCanvas = tempDiv.querySelector('canvas');
                if (!qrCanvas) return;

                // 2. เตรียม Canvas หลักสำหรับวาดรวม (QR + ข้อความ)
                const canvas = document.getElementById('hidden-canvas');
                const ctx = canvas.getContext('2d');
                
                // กำหนดขนาดภาพสุดท้าย (เผื่อพื้นที่ด้านล่าง 80px สำหรับข้อความ)
                const finalWidth = 400;
                const finalHeight = 400 + (bottomText ? 80 : 0);
                
                canvas.width = finalWidth;
                canvas.height = finalHeight;

                // ถมพื้นหลังสีขาว
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, finalWidth, finalHeight);

                // วาด QR Code ลงไป (ตำแหน่ง x=0, y=0)
                ctx.drawImage(qrCanvas, 0, 0);

                // 3. วาดข้อความด้านล่าง
                if (bottomText) {
                    ctx.fillStyle = "#000000";
                    ctx.font = "24px 'Kanit', sans-serif";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    // วาดตรงกลางแนวนอน (width/2) และกึ่งกลางพื้นที่ด้านล่าง (400 + 40)
                    ctx.fillText(bottomText, finalWidth / 2, 440);
                }

                // 4. แสดงผลลัพธ์ออกทาง tag <img>
                const finalDataUrl = canvas.toDataURL("image/png");
                previewImg.src = finalDataUrl;
                previewImg.style.display = 'block';
                loadingText.style.display = 'none';

            }, 200); // ดีเลย์ 200ms รอรูปโลโก้โหลดและวาดเสร็จ
        }

        // ฟังก์ชันดาวน์โหลดภาพ
        function downloadImage() {
            const previewImg = document.getElementById('final-preview');
            if (!previewImg.src || previewImg.style.display === 'none') {
                alert("กรุณาสร้างรูปภาพก่อนทำการดาวน์โหลด");
                return;
            }

            // สร้างลิ้งก์ดาวน์โหลดจำลอง
            const link = document.createElement('a');
            link.download = 'QR_ReKaKungTaLay.png';
            link.href = previewImg.src;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // สร้างอัตโนมัติเมื่อโหลดหน้าเว็บเสร็จ
        window.onload = () => {
            generateQRCode();
        };

    </script>
</body>
</html>
