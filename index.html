<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สร้าง QR Code พร้อมโลโก้</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">เครื่องมือสร้าง QR Code</h1>

        <div class="space-y-4 mb-6">
            <!-- URL Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ลิ้งก์ (URL)</label>
                <input type="text" id="urlInput" value="https://www.facebook.com/ReKaKungTaLay" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <!-- Text Bottom Input -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ข้อความด้านล่าง</label>
                <input type="text" id="textInput" value="สแกนเพื่อเยี่ยมชม Facebook Page" 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
            </div>

            <!-- Logo Upload -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">อัปโหลดโลโก้ (ตรงกลาง)</label>
                <input type="file" id="logoInput" accept="image/*" 
                    class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
        </div>

        <!-- Canvas Container -->
        <div class="flex justify-center bg-gray-50 p-4 rounded-lg border border-dashed border-gray-300 mb-6 overflow-hidden">
            <canvas id="mainCanvas" width="400" height="460" class="max-w-full h-auto shadow-sm rounded"></canvas>
        </div>

        <!-- Download Button -->
        <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
            ดาวน์โหลด QR Code
        </button>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const textInput = document.getElementById('textInput');
        const logoInput = document.getElementById('logoInput');
        const mainCanvas = document.getElementById('mainCanvas');
        const downloadBtn = document.getElementById('downloadBtn');
        const ctx = mainCanvas.getContext('2d');

        const qrSize = 400;
        const bottomTextHeight = 60;
        let currentLogoImage = null;

        // Function to draw everything on the canvas
        async function renderCanvas() {
            const url = urlInput.value || ' ';
            const text = textInput.value;

            // 1. Clear Canvas & Fill White Background
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

            // 2. Generate QR Code to a temporary canvas
            const tempCanvas = document.createElement('canvas');
            await new Promise((resolve, reject) => {
                QRCode.toCanvas(tempCanvas, url, {
                    width: qrSize,
                    margin: 2,
                    color: { dark: '#000000', light: '#ffffff' },
                    errorCorrectionLevel: 'H' // High error correction to allow logo
                }, (error) => {
                    if (error) reject(error);
                    else resolve();
                });
            });

            // 3. Draw QR Code onto main canvas
            ctx.drawImage(tempCanvas, 0, 0);

            // 4. Draw Logo if exists
            if (currentLogoImage) {
                const logoSize = qrSize * 0.25; // Logo size is 25% of QR code
                const centerX = qrSize / 2;
                const centerY = qrSize / 2;
                
                // Draw white box behind logo for better readability
                ctx.fillStyle = '#ffffff';
                const boxPadding = 10;
                ctx.fillRect(
                    centerX - (logoSize / 2) - boxPadding, 
                    centerY - (logoSize / 2) - boxPadding, 
                    logoSize + (boxPadding * 2), 
                    logoSize + (boxPadding * 2)
                );

                // Draw the logo image
                ctx.drawImage(
                    currentLogoImage, 
                    centerX - (logoSize / 2), 
                    centerY - (logoSize / 2), 
                    logoSize, 
                    logoSize
                );
            }

            // 5. Draw Text at the bottom
            if (text) {
                ctx.fillStyle = '#000000';
                ctx.font = '600 20px "Sarabun", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, mainCanvas.width / 2, qrSize + (bottomTextHeight / 2) - 5);
            }
        }

        // Event Listeners for inputs
        urlInput.addEventListener('input', renderCanvas);
        textInput.addEventListener('input', renderCanvas);

        logoInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        currentLogoImage = img;
                        renderCanvas();
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            } else {
                currentLogoImage = null;
                renderCanvas();
            }
        });

        // Download functionality
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'facebook-qrcode.png';
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
        });

        // Initial render
        renderCanvas();
        // Load custom font before rendering again to ensure correct font is used
        document.fonts.ready.then(function () {
            renderCanvas();
        });
    </script>
</body>
</html>
